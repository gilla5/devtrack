<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DevTrack{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="bar">
  <a class="brand" href="{{ url_for('dashboard.index') }}">DevTrack</a>
  <nav>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
      <a href="{{ url_for('applications.list_') }}">Applications</a>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link">Log out</button>
      </form>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Log in</a>
      <a href="{{ url_for('auth.register') }}">Sign up</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<p class="flash {{ cat }}" role="status">{{ msg }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
